[project]
name = "flightperf"
version = "0.1.0"
description = "Per-flight fuel, CO2 and regulatory cost analytics for French air traffic, from ADS-B trajectories."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "openap>=1.5",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "tqdm>=4.66",
    "rich>=13.7",
    # Pinned below 3.3: the 3.3 Windows binary wheels ship a libpq DLL
    # that fails to load ("DLL load failed while importing pq").
    "psycopg[binary]>=3.2,<3.3",
    "scipy>=1.13,<1.16",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "python-docx>=1.2.0",
    "ruff>=0.6",
]

[project.scripts]
flightperf = "flightperf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightperf"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
